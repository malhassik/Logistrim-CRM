{% extends 'fleet/base.html' %}

{% block title %}Добавить заправку | Логистрим{% endblock %}

{% block content %}
<style>
    /* Стили для этой конкретной страницы (чтобы форма была красивой) */
    .form-container {
        background: #1e1e1e;
        width: 50%;
        margin: 50px auto;
        padding: 30px;
        border-radius: 10px;
        border: 1px solid #333;
        color: white;
        font-family: Arial;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin-bottom: 5px;
        color: #aaa;
    }

    .form-control {
        width: 100%;
        padding: 10px;
        background: #2d2d2d;
        border: 1px solid #444;
        color: white;
        border-radius: 5px;
    }

    button {
        padding: 12px;
        background: #e74c3c;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
        font-weight: bold;
    }
</style>

<div class="form-container">
    <h1>Новая заправка</h1>

    <div id="form-messages" style="margin-bottom: 15px; font-weight: bold;"></div>

    <!-- Обрати внимание: тут нет тегов head, body и скриптов! Они в base.html -->
    <form id="fuel-form" method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Машина:</label>
            {{ form.truck }}
        </div>
        <div class="form-group">
            <label>Литры:</label>
            {{ form.liters }}
        </div>
        <div class="form-group">
            <label>Стоимость (руб):</label>
            {{ form.price }}
        </div>
        <button type="submit">Сохранить заправку</button>
    </form>
</div>
{% endblock %}
