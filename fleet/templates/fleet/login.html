<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Вход в систему | Логистрим</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding-top: 100px;
            text-align: center;
        }

        .card {
            background: #1e1e1e;
            width: 300px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        h2 {
            color: #fff;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            box-sizing: border-box;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0056b3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background: #007bff;
        }

        .error {
            color: #ff4444;
            font-size: 14px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Вход в Логистрим</h2>

        <!-- Если ввели неверный пароль, Django выведет здесь ошибку -->
        {% if form.errors %}
        <div class="error">Неверный логин или пароль</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <!-- Django сам нарисует поля для логина и пароля -->
            <input type="text" name="username" placeholder="Логин" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
    </div>
</body>

</html>
